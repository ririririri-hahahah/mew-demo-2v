<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b12"><title>Mew Ver.3</title>
<style>
:root{--bg:#090b12;--panel:#12141e;--panel2:#1b1e2a;--line:#2b2d3b;--text:#f5f2fa;--muted:#a6a5b7;--purple:#c8a6ff;--pink:#ff7d9c;--red:#ff566e}
*{box-sizing:border-box}body{margin:0;background:#07080d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:95px;position:relative}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:15;background:#090b12ed;backdrop-filter:blur(12px)}.logo{font-size:27px;font-weight:850;letter-spacing:-1px;background:linear-gradient(110deg,#fff,#cda6ff);background-clip:text;color:transparent}.top-avatar{border:0;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffe4f3,#aa89f5);color:#15101d;font-weight:900}.content{padding:12px 17px 18px}.hero{border:1px solid #383247;border-radius:24px;background:radial-gradient(circle at 80% 30%,#34263f,#171722 65%);padding:19px;margin-bottom:24px}.hero small{display:block;color:#c6b6d2;margin-bottom:12px}.hero button{border:1px solid #353240;background:#12131d;color:white;border-radius:16px;padding:12px 16px;font-weight:700}h1{font-size:20px;margin:10px 0 18px}h2{font-size:18px;margin:20px 0 12px}.post{background:linear-gradient(135deg,#151720,#101119);border:1px solid var(--line);border-radius:25px;padding:14px;margin-bottom:14px;position:relative}.post-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}.avatar{width:45px;height:45px;flex:none;border-radius:50%;border:2px solid var(--purple);display:grid;place-items:center;background:linear-gradient(135deg,#4a315e,#9372ac);font-weight:750;font-size:15px}.avatar.blue{background:linear-gradient(135deg,#1d4b65,#8e9db9)}.avatar.rose{background:linear-gradient(135deg,#6c3d5e,#b8898d)}.user{flex:1;min-width:0}.username{font-weight:800}.date{color:var(--muted);font-size:12px;margin-top:3px}.dots{border:0;background:transparent;color:#d8d3e5;font-size:24px;line-height:1;padding:7px 10px}.song{display:flex;gap:13px;align-items:flex-start}.art{width:44%;aspect-ratio:1/1;border-radius:17px;flex:none;display:grid;place-items:center;font-size:65px;overflow:hidden}.songinfo{flex:1;min-width:0;padding-top:7px}.songtitle{font-weight:850;font-size:21px;overflow-wrap:anywhere}.artist{color:var(--muted);margin-top:4px;font-size:14px}.tag{display:inline-block;color:var(--purple);background:#2b2540;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:12px}.comment{line-height:1.6;font-size:14px;margin-top:14px;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:7px;margin-top:15px;flex-wrap:wrap}.action{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:13px;font-size:12px;font-weight:700}.action.liked{color:var(--pink)}.push{margin-left:auto}.moremenu{position:absolute;right:13px;top:56px;width:min(250px,85%);z-index:8;border:1px solid #444154;border-radius:18px;background:#22232e;box-shadow:0 18px 50px #000a;padding:7px}.moremenu button{width:100%;background:transparent;border:0;color:#fff;text-align:left;padding:13px 12px;border-radius:11px;font-size:14px}.moremenu button:hover{background:#353343}.moremenu button.danger{color:#ff7d8d}.moremenu hr{border:0;border-top:1px solid #45414d;margin:5px 9px}.pin{color:var(--purple);font-size:12px;margin-bottom:9px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:20;background:#0e1019ed;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 4px max(12px,env(safe-area-inset-bottom))}.navbtn{background:transparent;border:0;color:#9695a8;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px;position:relative}.navbtn.active{color:var(--purple);font-weight:800}.navicon{font-size:23px;line-height:25px}.dot{position:absolute;top:0;left:calc(50% + 10px);width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #0e1019}.fab{position:fixed;z-index:21;bottom:calc(88px + env(safe-area-inset-bottom));left:max(17px,calc(50% - 223px));height:60px;width:60px;border:0;border-radius:50%;background:linear-gradient(135deg,#e7c6ff,#b18af0);color:#38234f;font-size:35px;box-shadow:0 8px 30px #ad82eb55}.listrow{display:flex;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid var(--line);cursor:pointer}.listrow .user{font-size:14px}.preview{font-size:13px;color:var(--muted);margin-top:5px}.rowtime{font-size:12px;color:var(--muted)}.small-dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px}.muted{color:var(--muted)}.input{width:100%;border:1px solid #383746;border-radius:13px;background:#1a1c28;color:white;padding:13px;margin:7px 0}.primary{background:var(--purple);color:#21142f;border:0;padding:12px 16px;border-radius:13px;font-weight:800}.secondary{background:#252536;color:white;border:1px solid #424051;padding:10px 13px;border-radius:12px}.chips{display:flex;gap:8px;margin:15px 0}.chip{border:1px solid var(--line);border-radius:25px;padding:9px 13px;background:#1b1b27;color:white}.chip.active{background:#403257;border-color:#a786d8}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{min-height:47px;border-radius:9px;background:#1c1d29;border:1px solid #2e2e3b;padding:6px;font-size:12px}.calday.has{background:linear-gradient(135deg,#7b528b,#343e65)}.calday.empty{background:transparent;border:0}.calweek{text-align:center;color:#aaa;font-size:11px;padding:7px 0}.modalback{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(440px,100%);max-height:85dvh;overflow:auto;background:#1b1b28;border:1px solid #464050;border-radius:23px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:white;font-size:26px}.chatline{max-width:85%;border-radius:15px;background:#292a38;padding:12px;margin:10px 0;font-size:14px}.chatline.mine{margin-left:auto;background:#514067}.inline{display:flex;gap:7px}.inline .input{flex:1;min-width:0}.hint{font-size:12px;color:#aaa;line-height:1.6}.profile-top{text-align:center}.profile-top .avatar{width:82px;height:82px;margin:0 auto 12px;font-size:26px}.stats{display:flex;justify-content:center;gap:30px;margin:18px 0}.stats b{display:block;font-size:20px}a{color:#d8baff}
</style>
</head><body><div class="app"><header><div class="logo">Mew</div><button class="top-avatar" onclick="go('profile')">NO</button></header><main id="main" class="content"></main></div><button class="fab" aria-label="投稿する" onclick="openComposer()">＋</button><nav class="bottom" id="nav"></nav><div id="overlay"></div>
<script>
const sample=[{id:1,user:'@Rik',initial:'RI',avatar:'',date:'今日 10:05',title:'結び',artist:'Ayumu Imazu',tag:'#Log',comment:'朝からこれ聴くと、なんか頑張れる。',art:'🎧',gradient:'linear-gradient(135deg,#46583c,#b87b72)',likes:12,pinned:false,own:true},{id:2,user:'@NustB',initial:'NB',avatar:'blue',date:'今日 10:02',title:'尾田栄一郎',artist:'Nust B',tag:'',comment:'最近ワンピース追えてないな',art:'🎵',gradient:'linear-gradient(135deg,#b97f79,#6e4b5d)',likes:8,pinned:false,own:false},{id:3,user:'@Sora',initial:'SO',avatar:'rose',date:'昨日 23:14',title:'napori',artist:'Vaundy',tag:'#Night',comment:'夜に聴きたい曲。',art:'🌆',gradient:'linear-gradient(135deg,#655b93,#d58c9b)',likes:21,pinned:false,own:false}];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let posts=get('mew3-posts',sample),liked=get('mew3-liked',[]),saved=get('mew3-saved',[]),unreadChat=get('mew3-chat-unread',true),unreadFollow=get('mew3-follow-unread',true),chats=get('mew3-chats',{'Sora':['この曲めっちゃいいよね！'],'haru':['一緒に行きたい！']}),screen='feed',menuId=null,feedFilter='all',selectedChat='Sora',month=new Date();
function persist(){localStorage.setItem('mew3-posts',JSON.stringify(posts));localStorage.setItem('mew3-liked',JSON.stringify(liked));localStorage.setItem('mew3-saved',JSON.stringify(saved));localStorage.setItem('mew3-chat-unread',JSON.stringify(unreadChat));localStorage.setItem('mew3-follow-unread',JSON.stringify(unreadFollow));localStorage.setItem('mew3-chats',JSON.stringify(chats))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(s){screen=s;menuId=null;if(s==='chat')unreadChat=false;if(s==='profile')unreadFollow=false;persist();render();window.scrollTo(0,0)}
function nav(){const tabs=[['feed','⌂','Feed'],['people','⌕','People'],['chat','☏','Chat'],['calendar','▦','Calendar'],['profile','♙','Profile']];document.getElementById('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="navbtn ${screen===id?'active':''}" onclick="go('${id}')"><span class="navicon">${icon}</span>${label}${(id==='chat'&&unreadChat||id==='profile'&&unreadFollow)?'<span class="dot"></span>':''}</button>`).join('')}
function card(p){return `<article class="post">${p.pinned?'<div class="pin">⌁ 固定された投稿</div>':''}<div class="post-head"><div class="avatar ${esc(p.avatar)}">${esc(p.initial)}</div><div class="user"><div class="username">${esc(p.user)}</div><div class="date">${esc(p.date)}</div></div><button class="dots" aria-label="投稿メニュー" onclick="toggleMenu(${p.id})">⋮</button></div>${menuId===p.id?`<div class="moremenu"><button onclick="pinPost(${p.id})">♧ ${p.pinned?'固定を解除':'この投稿を固定する'}</button><button onclick="savePost(${p.id})">♧ ${saved.includes(p.id)?'コレクションから外す':'コレクションに追加'}</button>${p.own?`<button class="danger" onclick="deletePost(${p.id})">▤ この投稿を削除</button>`:''}<hr><button onclick="copyPost(${p.id})">↗ リンクをコピー</button>${!p.own?'<button onclick="alert(\'報告機能は本番版で追加予定です\')">⊘ 報告する</button>':''}</div>`:''}<div class="song"><div class="art" style="background:${esc(p.gradient)}">${esc(p.art)}</div><div class="songinfo"><div class="songtitle">${esc(p.title)}</div><div class="artist">${esc(p.artist)}</div>${p.tag?`<div class="tag">${esc(p.tag)}</div>`:''}<div class="comment">${esc(p.comment)}</div></div></div><div class="actions"><button class="action" onclick="alert('試聴機能は音楽API連携後に追加します')">▶ 試聴</button><button class="action" onclick="openMusic('${encodeURIComponent(p.title+' '+p.artist)}')">♫ 曲を探す</button><button class="action push ${liked.includes(p.id)?'liked':''}" onclick="like(${p.id})">${liked.includes(p.id)?'♥':'♡'} ${p.likes+(liked.includes(p.id)?1:0)}</button><button class="action" onclick="savePost(${p.id})">${saved.includes(p.id)?'▣':'♧'}</button></div></article>`}
function openMusic(q){window.open('https://music.apple.com/jp/search?term='+q,'_blank','noopener')}
function feed(){const sorted=[...posts].sort((a,b)=>Number(b.pinned)-Number(a.pinned));const shown=feedFilter==='saved'?sorted.filter(p=>saved.includes(p.id)):sorted;return `<section class="hero"><small>YOUR MUSIC, YOUR MOMENT</small><button onclick="openComposer()">＋ 今日の1曲を投稿する</button></section><h1>Today's feed</h1><div class="chips"><button class="chip ${feedFilter==='all'?'active':''}" onclick="feedFilter='all';render()">すべて</button><button class="chip ${feedFilter==='saved'?'active':''}" onclick="feedFilter='saved';render()">Collection</button></div>${shown.map(card).join('')||'<p class="muted">投稿はまだありません。</p>'}`}
function toggleMenu(id){menuId=menuId===id?null:id;render()}function pinPost(id){posts=posts.map(p=>({...p,pinned:p.id===id?!p.pinned:p.pinned}));menuId=null;persist();render()}function savePost(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];menuId=null;persist();render()}function like(id){liked=liked.includes(id)?liked.filter(x=>x!==id):[...liked,id];persist();render()}function deletePost(id){if(!confirm('この投稿を削除しますか？'))return;posts=posts.filter(p=>p.id!==id);menuId=null;persist();render()}function copyPost(id){menuId=null;const url=location.href.split('#')[0]+'#post-'+id;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>alert('リンクをコピーしました')).catch(()=>prompt('リンクをコピーしてください',url))}else prompt('リンクをコピーしてください',url);render()}
function people(){return `<h1>People</h1><input class="input" id="peopleSearch" placeholder="ユーザー名を検索" oninput="filterPeople()"><div id="peopleList">${peopleList('')}</div>`}function peopleList(q){return [['Sora','SO','blue'],['haru','HA','rose'],['Rik','RI',''],['NustB','NB','blue']].filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="listrow"><div class="avatar ${x[2]}">${x[1]}</div><div class="user"><b>@${x[0]}</b><div class="preview">音楽を通してつながろう</div></div><button class="secondary" onclick="alert('フォロー機能はSupabase連携後に実装します')">フォロー</button></div>`).join('')||'<p class="muted">見つかりませんでした。</p>'}function filterPeople(){document.getElementById('peopleList').innerHTML=peopleList(document.getElementById('peopleSearch').value)}
function chat(){return `<h1>Chat</h1><p class="hint">メッセージはこの端末だけに保存されるデモです。</p>${[['Sora','SO','blue','この曲めっちゃいいよね！'],['haru','HA','rose','一緒に行きたい！'],['Ayaka','AY','','プレイリスト送ったよ〜']].map(x=>`<div class="listrow" onclick="openChat('${x[0]}')"><div class="avatar ${x[2]}">${x[1]}</div><div class="user"><b>${x[0]}</b><div class="preview">${esc((chats[x[0]]||[]).at(-1)||x[3])}</div></div><span class="rowtime">今日</span></div>`).join('')}`}
function openChat(name){selectedChat=name;screen='chatdetail';render()}function chatdetail(){return `<button class="secondary" onclick="go('chat')">← Chat</button><h1 style="margin-top:20px">${esc(selectedChat)}</h1><div class="box" style="min-height:35vh">${(chats[selectedChat]||[]).map((m,i)=>`<div class="chatline ${i?'mine':''}">${esc(m)}</div>`).join('')}</div><div class="inline"><input id="message" class="input" placeholder="メッセージ"><button class="primary" onclick="sendMessage()">送信</button></div><p class="hint">相手には送信されません。</p>`}function sendMessage(){const el=document.getElementById('message');if(!el.value.trim())return;(chats[selectedChat]??=[]).push(el.value.trim());persist();render()}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html=Array(first).fill('<div class="calday empty"></div>').join('');for(let i=1;i<=days;i++)html+=`<div class="calday ${[3,6,10,12,18].includes(i)?'has':''}">${i}${[3,6,10,12,18].includes(i)?' ♪':''}</div>`;return `<h1>My Melory</h1><div class="box"><div class="inline" style="justify-content:space-between;align-items:center;margin-bottom:16px"><button class="secondary" onclick="shiftMonth(-1)">‹</button><b>${y}年${m+1}月</b><button class="secondary" onclick="shiftMonth(1)">›</button></div><div class="calendar">${'日月火水木金土'.split('').map(x=>`<div class="calweek">${x}</div>`).join('')}${html}</div></div><p class="hint">色付きの日付はサンプルです。投稿との連動は今後実装します。</p>`}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function profile(){return `<h1>Profile</h1><div class="box profile-top"><div class="avatar">NO</div><h2>No1</h2><div class="muted">@Rik</div><div class="stats"><div><b>${posts.filter(p=>p.own).length}</b>Posts</div><div><b>4</b>Followers</div><div><b>6</b>Following</div></div><button class="secondary" onclick="alert('プロフィール編集は今後実装します')">プロフィールを編集</button></div><div class="box" onclick="showFollows()" style="cursor:pointer"><b>フォローリクエスト</b><p class="muted">新しいフォロー申請を確認する　›</p></div><h2>My Posts</h2>${posts.filter(p=>p.own).map(card).join('')||'<p class="muted">まだ投稿はありません。</p>'}`}
function showFollows(){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>フォローリクエスト</h2><button class="close" onclick="closeModal()">×</button></div><div class="listrow"><div class="avatar blue">HI</div><div class="user"><b>@hinata</b><div class="preview">あなたをフォローしたいそうです</div></div><button class="secondary" onclick="alert('承認機能は本番版で実装します')">承認</button></div><p class="hint">この通知はデモ用です。</p></div></div>`}
function openComposer(){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>今日の1曲を投稿</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitPost(event)"><label>曲名<input class="input" name="title" required maxlength="70" placeholder="曲名を入力"></label><label>アーティスト<input class="input" name="artist" required maxlength="70" placeholder="アーティスト名"></label><label>一言コメント<textarea class="input" name="comment" rows="3" maxlength="180" placeholder="今の気分を一言"></textarea></label><label>タグ<input class="input" name="tag" maxlength="25" placeholder="#Log"></label><button class="primary" type="submit">投稿する</button></form><p class="hint">ジャケット画像はデモ用のグラデーションです。実際の画像取得は後から追加します。</p></div></div>`}
function submitPost(e){e.preventDefault();const f=new FormData(e.target);posts.unshift({id:Date.now(),user:'@Rik',initial:'RI',avatar:'',date:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),title:String(f.get('title')).trim(),artist:String(f.get('artist')).trim(),comment:String(f.get('comment')).trim(),tag:String(f.get('tag')).trim(),art:'♫',gradient:'linear-gradient(135deg,#513b7e,#bf8aab)',likes:0,pinned:false,own:true});persist();closeModal();go('feed')}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('overlay').innerHTML=''}
function render(){nav();document.getElementById('main').innerHTML=({feed,people,chat,chatdetail,calendar,profile})[screen]();document.querySelector('.fab').style.display=screen==='chatdetail'?'none':'block'}render();
</script></body></html>
