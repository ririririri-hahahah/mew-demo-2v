<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mew Ver.2</title><style>
:root{--bg:#fff;--surface:#f6f6f7;--ink:#191919;--muted:#797979;--line:#e8e8e9;--accent:#191919}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:2;background:#ffffffed;border-bottom:1px solid var(--line);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:30px;font-weight:850;letter-spacing:-1.5px}.avatar{width:43px;height:43px;border-radius:50%;background:#ededed;display:grid;place-items:center;font-weight:750}.app{max-width:560px;margin:auto}main{padding:22px 18px 105px;min-height:calc(100dvh - 76px)}h1{font-size:25px;margin:0 0 18px}h2{font-size:21px;margin:22px 0 13px}.muted{color:var(--muted)}.panel{background:var(--surface);border-radius:22px;padding:20px}.cta{background:var(--ink);color:white;padding:12px 17px;border-radius:12px;font-weight:750}.pill{padding:11px 17px;border-radius:22px;background:#f1f1f1;color:#333}.pill.active{background:#191919;color:#fff}.tabs{display:flex;gap:8px;margin:20px 0}.card{border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;background:white}.song{display:flex;gap:14px;align-items:center}.art{width:92px;height:92px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:34px;background:linear-gradient(140deg,#1c314c,#91afbc)}.songtitle{font-weight:800;font-size:19px}.small{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button,.secondary{border:1px solid var(--line);border-radius:12px;background:#f7f7f7;padding:11px 13px}.actions .liked{background:#ffe9ed;color:#d72b55}.field{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#fafafa;outline:none;margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:3}.navinner{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:#888;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px;padding:5px 0}.nav button span{font-size:22px}.nav button.active{color:#111;font-weight:800}.person{display:flex;align-items:center;gap:12px;justify-content:space-between}.person .avatar{flex-shrink:0}.personname{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);display:flex;align-items:flex-start;justify-content:flex-start;padding:5px;font-size:12px;background:#fafafa}.day.has{background:linear-gradient(145deg,#ffd1c1,#96a8d2);font-weight:800}.day.empty{border:0;background:none}.week{text-align:center;font-size:12px;color:#888;margin:8px 0}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.calhead button{padding:10px 14px;border-radius:12px;background:#eee}.profile{text-align:center}.profile .avatar{width:90px;height:90px;margin:8px auto;font-size:25px}.stats{display:flex;justify-content:center;gap:22px;margin:20px 0}.stat b{display:block}.chatbubble{padding:12px 14px;border-radius:15px;background:#f2f2f2;margin:8px 0;max-width:82%}.chatbubble.mine{margin-left:auto;background:#202020;color:white}.chatbox{display:flex;gap:8px}.chatbox input{flex:1;min-width:0}.notice{font-size:12px;color:#888;margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none}@media(min-width:650px){body{background:#f4f4f5}.app{background:white;min-height:100vh;box-shadow:0 0 30px #00000009}}
</style></head><body><div class="app"><header><div class="logo">Mew.</div><button class="avatar" onclick="go('profile')">NO</button></header><main id="view"></main></div><nav class="nav"><div class="navinner" id="nav"></div></nav><script>
const initial=[{id:1,user:'@TKG',title:'ケムリ',artist:'ONE OK ROCK',note:'やっぱりワンオク',art:'🎸',color:'linear-gradient(135deg,#242424,#999)',following:true,likes:4},{id:2,user:'@Rik',title:'CHE.R.RY',artist:'YUI',note:'今日はこの曲！',art:'🌸',color:'linear-gradient(135deg,#edb2b6,#f2dfb8)',following:true,likes:8},{id:3,user:'@Jon',title:'snow jam',artist:'Rin音',note:'夜に聴きたくなる曲',art:'🌙',color:'linear-gradient(135deg,#233c5c,#98bad6)',following:false,likes:15},{id:4,user:'@moya',title:'napori',artist:'Vaundy',note:'最近ずっと聴いてる',art:'🌅',color:'linear-gradient(135deg,#dc8a8f,#643b87)',following:false,likes:12}];
const load=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};let posts=load('mew-posts',initial),likes=load('mew-likes',[]),following=load('mew-following',['@TKG','@Rik']),messages=load('mew-messages',{}),screen='feed',feedTab='foryou',selectedChat='@Jon',search='',month=new Date(2026,9,1),profileTab='posts';const save=()=>{localStorage.setItem('mew-posts',JSON.stringify(posts));localStorage.setItem('mew-likes',JSON.stringify(likes));localStorage.setItem('mew-following',JSON.stringify(following));localStorage.setItem('mew-messages',JSON.stringify(messages))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(s){screen=s;render();scrollTo(0,0)}function render(){const items=[['feed','⌂','Feed'],['people','⌕','People'],['chat','☏','Chat'],['calendar','▦','Calendar'],['profile','●','Profile']];document.getElementById('nav').innerHTML=items.map(([id,ico,label])=>`<button class="${screen===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('');document.getElementById('view').innerHTML=({feed:feed,people:people,chat:chat,calendar:calendar,profile:profile})[screen]();}
function postCard(p){return `<article class="card"><div class="song"><div class="art" style="background:${p.color}">${esc(p.art)}</div><div><div class="songtitle">${esc(p.title)}</div><div class="muted">${esc(p.artist)}</div><div class="muted small">${esc(p.user)} · 今日の1曲</div></div></div><p>${esc(p.note)}</p><div class="actions"><button class="${likes.includes(p.id)?'liked':''}" onclick="like(${p.id})">${likes.includes(p.id)?'♥':'♡'} いいね ${p.likes+(likes.includes(p.id)?1:0)}</button><button onclick="openChat('${esc(p.user)}')">💬 Chat</button><button onclick="alert('音楽サービスとの連携は今後追加予定です')">▶ 聴く</button></div></article>`}
function feed(){const shown=feedTab==='following'?posts.filter(p=>following.includes(p.user)||p.user==='@me'):posts;return `<div class="panel"><div class="muted small" style="font-weight:700;letter-spacing:1px">YOUR MUSIC, YOUR MOMENT</div><h1 style="margin:10px 0">今日はどんな気分？</h1><p class="muted">あなたの「今」を1曲で残そう。</p><button class="cta" onclick="addPost()">＋ 今日の1曲</button></div><div class="tabs"><button class="pill ${feedTab==='foryou'?'active':''}" onclick="feedTab='foryou';render()">For You</button><button class="pill ${feedTab==='following'?'active':''}" onclick="feedTab='following';render()">Following</button></div><h2>${feedTab==='foryou'?'あなたへのおすすめ':'フォロー中の投稿'}</h2>${shown.map(postCard).join('')||'<p class="muted">投稿はまだありません。</p>'}`}
function like(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];save();render()}function addPost(){const title=prompt('今日の曲名を入力してね');if(!title?.trim())return;const artist=prompt('アーティスト名は？')||'Unknown';const note=prompt('ひとこと（省略OK）')||'';posts.unshift({id:Date.now(),user:'@me',title:title.trim(),artist,note,art:'🎵',color:'linear-gradient(135deg,#3b6d79,#b8c9a7)',likes:0,following:true});save();render()}
const users=[['@Jon','Jon','JO'],['@hiroto116n','もやし','もや'],['@developer111','De','DE'],['@TKG','TKG','TK'],['@Rik','Rik','RI']];function people(){return `<h1>ユーザー検索</h1><input class="field" placeholder="ユーザー名を検索" value="${esc(search)}" oninput="search=this.value;renderPeople()" id="searchbox"><div id="people-results">${peopleResults()}</div>`}function peopleResults(){const found=users.filter(u=>u[0].toLowerCase().includes(search.toLowerCase())||u[1].toLowerCase().includes(search.toLowerCase()));return search||found.length?found.map(u=>`<div class="card person"><div class="avatar">${u[2]}</div><div class="personname"><b>${esc(u[0])}</b><div class="muted small">${esc(u[1])}</div></div><button class="secondary" onclick="follow('${u[0]}')">${following.includes(u[0])?'フォロー中':'フォロー'}</button></div>`).join(''):'<p class="muted" style="text-align:center;margin-top:50px">ユーザー名を入力して検索</p>'}function renderPeople(){document.getElementById('people-results').innerHTML=peopleResults()}function follow(u){following=following.includes(u)?following.filter(x=>x!==u):[...following,u];save();render()}
function chat(){if(selectedChat&&screen==='chat-detail'){return chatDetail()}return `<h1>Messages</h1>${users.slice(0,3).map(u=>`<div class="card person"><div class="avatar">${u[2]}</div><div class="personname"><b>${esc(u[0])}</b><div class="muted">${esc(u[1])}</div></div><button class="secondary" onclick="openChat('${u[0]}')">開く</button></div>`).join('')}`};function openChat(u){selectedChat=u;screen='chat-detail';document.getElementById('nav').innerHTML='';document.getElementById('view').innerHTML=chatDetail();scrollTo(0,0)}function chatDetail(){const msg=messages[selectedChat]||[];return `<button class="secondary" onclick="go('chat')">← Messages</button><h1 style="margin-top:20px">${esc(selectedChat)}</h1><div style="min-height:35vh">${msg.map(m=>`<div class="chatbubble mine">${esc(m)}</div>`).join('')||'<p class="muted">メッセージを送ってみよう（この端末だけのデモ）</p>'}</div><div class="chatbox"><input class="field" id="msg" placeholder="メッセージを入力"><button class="cta" onclick="sendMsg()">送信</button></div>`}function sendMsg(){const el=document.getElementById('msg');if(!el.value.trim())return;(messages[selectedChat]??=[]).push(el.value.trim());save();document.getElementById('view').innerHTML=chatDetail()}
function calendar(){const year=month.getFullYear(),m=month.getMonth(),first=new Date(year,m,1).getDay(),days=new Date(year,m+1,0).getDate();let cells=Array(first).fill('<div class="day empty"></div>');for(let d=1;d<=days;d++){const sample=year===2026&&m===9&&[3,6,7,8].includes(d);cells.push(`<button class="day ${sample?'has':''}" onclick="${sample?`alert('この日の音楽の記録（サンプル）')`:`alert('この日の投稿はまだありません')`}">${d}${sample?' ♪':''}</button>`)}return `<h1>My Melory</h1><div class="card"><div class="calhead"><button onclick="moveMonth(-1)">‹</button><b>${year}年${m+1}月</b><button onclick="moveMonth(1)">›</button></div><div class="calendar">${'日月火水木金土'.split('').map(x=>`<div class="week">${x}</div>`).join('')}${cells.join('')}</div></div><p class="notice">色付きの日付はサンプルの投稿履歴です。</p>`}function moveMonth(delta){month=new Date(month.getFullYear(),month.getMonth()+delta,1);render()}
function profile(){return `<div class="card profile"><div class="avatar">NO</div><h1>No1</h1><p class="muted">@Rik</p><div class="stats"><div class="stat"><b>${posts.length+6}</b>Posts</div><div class="stat"><b>4</b>Followers</div><div class="stat"><b>${following.length}</b>Following</div></div><button class="secondary" onclick="alert('プロフィール編集は今後追加予定です')">プロフィールを編集</button></div><div class="card row" onclick="alert('フォローリクエストはデモでは未対応です')"><div><b>フォローリクエスト</b><div class="muted small">届いた申請を確認</div></div><b>›</b></div><div class="card row"><div><b>🔒 非公開アカウント</b><div class="muted small">デモ設定</div></div><input type="checkbox" aria-label="非公開アカウント"></div><div class="tabs"><button class="pill ${profileTab==='posts'?'active':''}" onclick="profileTab='posts';render()">Posts</button><button class="pill ${profileTab==='collections'?'active':''}" onclick="profileTab='collections';render()">Collections</button></div>${profileTab==='posts'?posts.filter(p=>p.user==='@me').map(postCard).join('')||'<p class="muted">まだ自分の投稿はありません。Feedから投稿してみよう。</p>':'<p class="muted">保存した曲は今後ここに表示します。</p>'}`}
render();
</script></body></html>
